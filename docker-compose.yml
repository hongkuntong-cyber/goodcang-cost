version: "3.9"

# GoodCang Cost Intelligence 一键编排
# 服务：db(PostgreSQL) + backend(FastAPI) + frontend(Nginx 托管 Vue3 构建产物)
# 说明：backend/frontend 的 Dockerfile 在 Step 2/6 完成后即可直接构建启动。

services:
  # ---- PostgreSQL 数据库 ----
  db:
    image: postgres:16-alpine
    container_name: gcw_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goodcang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-goodcang_cost}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goodcang}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- FastAPI 后端 ----
  backend:
    build:
      context: ./backend
    container_name: gcw_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 容器内数据库指向 db 服务
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-goodcang}:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/${POSTGRES_DB:-goodcang_cost}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- Vue3 + ECharts 前端 ----
  frontend:
    build:
      context: ./frontend
    container_name: gcw_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
