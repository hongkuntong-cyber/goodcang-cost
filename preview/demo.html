  .content { flex: 1; padding: 24px; max-width: 1200px; }
  .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .kpi .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .value.up { color: var(--up); }
  .value.down { color: var(--down); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .chart { width: 100%; height: 360px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; background: #fafbfc; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; color: #fff; }
  .badge.healthy { background: #16a34a; }
  .badge.watch { background: #f59e0b; }

  .badge.critical { background: #e64545; }

  .report-md h2 { font-size: 15px; margin: 16px 0 8px; }

  .banner {
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
    padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 20px;

// ==================== 工具 ====================
function fmt(v) {
  return v == null ? '—' : Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function mdToHtml(md) {
  let h = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  h = h.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  h = h.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  h = h.replace(/^- (.*)$/gm, '<li>$1</li>');
  h = h.replace(/((?:<li>[\s\S]*?<\/li>\s*)+)/g, '<ul>$1</ul>');
  return h;
}

  });

  if (activeTab === 'cost') drawTrend();
  if (activeTab === 'structure') drawStructure();
  if (activeTab === 'inventory') drawHealth();
  if (activeTab === 'risk') drawRisk();

    ...baseOption(),

    xAxis: { type: 'category', data: DATA.trend.map(x => x.month) },
    yAxis: { type: 'value', name: '€' },

}

    legend: { orient: 'vertical', left: 'left' },
    series: [{
      type: 'pie', radius: ['40%', '68%'], center: ['55%', '50%'],
      itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
      label: { formatter: '{b}\n{d}%' },
      data: items.map(i => ({ name: i.label, value: i.amount }))
    }]
  });
}
function drawHealth() {
  const el = document.getElementById('chart-health'); if (!el) return;
  const c = echarts.init(el);
  const buckets = DATA.health.buckets;
  const colors = { healthy: '#16a34a', watch: '#f59e0b', stale: '#f97316', critical: '#e64545' };
  c.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: buckets.map(b => b.label) },
    xAxis: { type: 'category', data: buckets.map(b => b.label) },
    yAxis: { type: 'value', name: '件' },
    series: [{
      type: 'bar', barWidth: '45%',
      data: buckets.map(b => ({ value: b.quantity, itemStyle: { color: colors[b.bucket] } }))
    }]
  });
}
function drawRisk() {
  const el = document.getElementById('chart-risk'); if (!el) return;
  const c = echarts.init(el);
  const top10 = DATA.risk.slice(0, 10).reverse();
  c.setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: 110, right: 30, top: 20, bottom: 30 },
    xAxis: { type: 'value', name: '库龄(天)' },
    yAxis: { type: 'category', data: top10.map(x => x.sku) },
    series: [{
      type: 'bar', barWidth: '55%',
      data: top10.map(x => ({
        value: x.warehouse_age,
        itemStyle: { color: x.age_bucket === 'critical' ? '#e64545' : x.age_bucket === 'stale' ? '#f97316' : '#f59e0b' }
      }))
    }]
  });
}

window.addEventListener('resize', () => Object.values(charts).forEach(c => c && c.resize()));

render();
</script>
</body>
</html>
