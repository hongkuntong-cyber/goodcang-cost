<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --border: #e6e9f0;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2f6bff;
    --accent: #7c3aed;
    --up: #e64545;
    --down: #16a34a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 18px; font-weight: 600; }
  .topbar .hint { font-size: 12px; color: var(--muted); }
  .badge-demo {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; color: #fff; background: linear-gradient(90deg,#16a34a,#2f6bff);
  }
  .content { padding: 24px; max-width: 1280px; margin: 0 auto; }
  .banner {
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
    padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 20px;
  }
  /* 主体分块 */
  .account-section { margin-bottom: 36px; }
  .account-head {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
  }
  .account-head .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .account-head .code {
    font-size: 20px; font-weight: 700; letter-spacing: .5px;
  }
  .account-head .name { font-size: 13px; color: var(--muted); }
  .account-head .pill {
    font-size: 12px; padding: 3px 10px; border-radius: 999px;
    background: #f1f5ff; color: var(--primary); font-weight: 500;
  }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px;
  }
  .kpi .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .kpi .value { font-size: 26px; font-weight: 700; }
  .kpi .value.small { font-size: 20px; }
  .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .value.up { color: var(--up); }
  .value.down { color: var(--down); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .chart { width: 100%; height: 340px; }
  .chart.tall { height: 380px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; background: #fafbfc; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; color: #fff; }
  .badge.healthy { background: #16a34a; }
  .badge.watch { background: #f59e0b; }
  .badge.stale { background: #f97316; }
  .badge.critical { background: #e64545; }
  .section-title {
    font-size: 16px; font-weight: 700; margin: 8px 0 14px;
    padding-left: 10px; border-left: 4px solid var(--primary);
  }
  .section-title .sub { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 8px; }
  @media (max-width: 900px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
  }
</style>
</head>

// ==================== 工具 ====================
function fmt(v) {
  return v == null ? '—' : Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtInt(v) {
  return v == null ? '—' : Number(v).toLocaleString('zh-CN');
}
function momCls(v) { return v > 0 ? 'up' : v < 0 ? 'down' : ''; }
function momTxt(v) { return v > 0 ? '+' + v + '%' : v + '%'; }

const CAT_COLORS = {
  storage: '#2f6bff',
  inbound: '#7c3aed',
  outbound: '#f59e0b',
  transport: '#e64545',
  other: '#94a3b8'
};

// ==================== 渲染两个主体 ====================
const container = document.getElementById('accounts');
let chartSeq = 0;

function renderAccount(acc, idx) {
  const s = acc.summary;
  const trend = acc.trend || [];
  const totalSum = trend.reduce((a, x) => a + (x.total || 0), 0);
  const avg = trend.length ? totalSum / trend.length : 0;
  const dotColor = idx === 0 ? '#2f6bff' : '#7c3aed';

  // KPI
  const kpi = `
    <div class="kpi-row">
      <div class="kpi">
        <div class="label">最新月总成本</div>
        <div class="value">€${fmt(s.total)}</div>
        <div class="sub">${s.month}</div>
      </div>
      <div class="kpi">
        <div class="label">环比变化</div>
        <div class="value ${momCls(s.mom_pct)}">${s.mom_pct == null ? '—' : momTxt(s.mom_pct)}</div>
        <div class="sub">较上一有账单月份</div>
      </div>
      <div class="kpi">
        <div class="label">月均成本</div>
        <div class="value small">€${fmt(avg)}</div>
        <div class="sub">${trend.length} 个月</div>
      </div>
      <div class="kpi">
        <div class="label">累计成本</div>
        <div class="value small">€${fmt(totalSum)}</div>
        <div class="sub">账单 ${acc.bill_count} 条</div>
      </div>
    </div>`;

  // 费用结构表格行
  const structRows = s.structure.map(i =>
    `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${CAT_COLORS[i.category]};margin-right:8px"></span>${i.label}</td><td>€${fmt(i.amount)}</td><td>${s.total ? (i.amount / s.total * 100).toFixed(1) : 0}%</td></tr>`
  ).join('');

  // 唯一 chart id
  const cid = 'c' + (chartSeq++);

  const html = `
    <div class="account-section">
      <div class="account-head">
        <span class="dot" style="background:${dotColor}"></span>
        <span class="code">${acc.account_code}</span>
        <span class="name">${acc.account_name}</span>
        <span class="pill">主体 ${idx + 1}</span>
      </div>
      ${kpi}
      <div class="card"><h2>月度成本趋势（${acc.account_code}）</h2><div id="${cid}-trend" class="chart"></div></div>
      <div class="grid-2">
        <div class="card"><h2>费用结构（${s.month}）</h2><div id="${cid}-pie" class="chart"></div></div>
        <div class="card"><h2>费用明细</h2>
          <table><thead><tr><th>类别</th><th>金额</th><th>占比</th></tr></thead>
          <tbody>${structRows}</tbody></table>
        </div>
      </div>
    </div>`;

  container.insertAdjacentHTML('beforeend', html);

  // 图表渲染
  if (typeof echarts !== 'undefined') {
    renderTrend(acc, cid, dotColor);
    renderPie(acc, cid);
  }
}

function renderTrend(acc, cid, color) {
  const el = document.getElementById(cid + '-trend'); if (!el) return;
  const trend = acc.trend || [];
  const c = echarts.init(el);
  c.setOption({
    textStyle: { fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif' },
    tooltip: { trigger: 'axis' },
    legend: { data: ['总成本', '仓储费', '入库费', '出库操作费', '运输费'] },
    grid: { left: 55, right: 20, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: trend.map(x => x.month) },
    yAxis: { type: 'value', name: '€' },
    series: [
      { name: '总成本', type: 'line', data: trend.map(x => x.total), smooth: true,
        itemStyle: { color }, areaStyle: { opacity: 0.08 }, symbolSize: 7 },
      { name: '仓储费', type: 'bar', stack: 's', data: trend.map(x => x.storage || 0), itemStyle: { color: CAT_COLORS.storage } },
      { name: '入库费', type: 'bar', stack: 's', data: trend.map(x => x.inbound || 0), itemStyle: { color: CAT_COLORS.inbound } },
      { name: '出库操作费', type: 'bar', stack: 's', data: trend.map(x => x.outbound || 0), itemStyle: { color: CAT_COLORS.outbound } },
      { name: '运输费', type: 'bar', stack: 's', data: trend.map(x => x.transport || 0), itemStyle: { color: CAT_COLORS.transport } }
    ]
  });
}

function renderPie(acc, cid) {
  const el = document.getElementById(cid + '-pie'); if (!el) return;
  const items = acc.summary.structure || [];
  const c = echarts.init(el);
  c.setOption({
    tooltip: { trigger: 'item', formatter: '{b}: €{c} ({d}%)' },
    legend: { orient: 'vertical', left: 'left' },
    series: [{
      type: 'pie', radius: ['42%', '70%'], center: ['58%', '50%'],
      itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
      label: { formatter: '{b}\n{d}%' },
      data: items.map(i => ({ name: i.label, value: i.amount, itemStyle: { color: CAT_COLORS[i.category] } }))
    }]
  });
}

// ==================== 库存健康 + 风险 ====================
function renderInventory() {
  const h = DATA.health;
  const colors = { healthy: '#16a34a', watch: '#f59e0b', stale: '#f97316', critical: '#e64545' };

  // 图表
  const elH = document.getElementById('chart-health');
  if (elH && typeof echarts !== 'undefined') {
    const c = echarts.init(elH);
    c.setOption({
      textStyle: { fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif' },
      tooltip: { trigger: 'axis' },
      legend: { data: h.buckets.map(b => b.label) },
      grid: { left: 55, right: 20, top: 40, bottom: 30 },
      xAxis: { type: 'category', data: h.buckets.map(b => b.label) },
      yAxis: { type: 'value', name: '件' },
      series: [{
        type: 'bar', barWidth: '45%',
        label: { show: true, position: 'top' },
        data: h.buckets.map(b => ({ value: b.quantity, itemStyle: { color: colors[b.bucket] } }))
      }]
    });
  }

  const elR = document.getElementById('chart-risk');
  if (elR && typeof echarts !== 'undefined') {
    const c = echarts.init(elR);
    const top10 = (DATA.risk || []).slice(0, 10).reverse();
    c.setOption({
      textStyle: { fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif' },
      tooltip: { trigger: 'axis' },
      grid: { left: 110, right: 30, top: 20, bottom: 30 },
      xAxis: { type: 'value', name: '库龄(天)' },
      yAxis: { type: 'category', data: top10.map(x => x.sku) },
      series: [{
        type: 'bar', barWidth: '55%',
        data: top10.map(x => ({
          value: x.warehouse_age,
          itemStyle: { color: x.age_bucket === 'critical' ? '#e64545' : x.age_bucket === 'stale' ? '#f97316' : '#f59e0b' }
        }))
      }]
    });
  }

  // 表格
  const hRows = h.buckets.map(b =>
    `<tr><td><span class="badge ${b.bucket}">${b.label}</span></td><td>${b.sku_count}</td><td>${fmtInt(b.quantity)}</td><td>${b.qty_pct}%</td></tr>`
  ).join('');
  document.getElementById('health-table').innerHTML = `
    <h2>库存年龄健康度明细（总量 ${fmtInt(h.total_quantity)} 件）</h2>
    <table><thead><tr><th>分类</th><th>SKU 数</th><th>库存件数</th><th>占比</th></tr></thead>
    <tbody>${hRows}</tbody></table>`;

  const rRows = (DATA.risk || []).map(r =>
    `<tr><td>#${r.rank}</td><td>${r.sku}</td><td>${r.product_name || '—'}</td><td>${r.warehouse_age}</td><td>${r.quantity}</td><td><span class="badge ${r.age_bucket}">${r.label}</span></td></tr>`
  ).join('');
  document.getElementById('risk-table').innerHTML = `
    <h2>TOP 20 风险 SKU（按库龄排序）</h2>
    <table><thead><tr><th>排名</th><th>SKU</th><th>商品名称</th><th>库龄(天)</th><th>库存数量</th><th>状态</th></tr></thead>
    <tbody>${rRows}</tbody></table>`;
}

// ==================== 启动 ====================
function boot() {
  if (!DATA.accounts || !DATA.accounts.length) {
    container.innerHTML = '<div class="banner" style="background:#fee2e2;border-color:#fca5a5;color:#991b1b">数据未加载：请确认 real-data.json 已正确注入。</div>';
    return;
  }
  DATA.accounts.forEach((acc, i) => renderAccount(acc, i));
  renderInventory();
  if (typeof echarts === 'undefined') {
    container.insertAdjacentHTML('afterbegin',
      '<div class="banner" style="background:#fee2e2;border-color:#fca5a5;color:#991b1b">ECharts CDN 加载失败，请检查网络连接后刷新。</div>');
  }
}

window.addEventListener('resize', () => {
  document.querySelectorAll('.chart').forEach(el => {
    const inst = echarts.getInstanceByDom(el);
    if (inst) inst.resize();
  });
});

boot();
</script>
</body>
</html>
